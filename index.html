<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dog Lover</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body>
    <main class="app-shell">
        <section class="hero-card">
            <h1>Dog Lover Gallery</h1>
            <p>Choose a breed and enjoy a smooth, animated image gallery.</p>

            <div id="container1" class="controls-row">
                <select id="breed" name="breed" aria-label="Choose breed"></select>
                <select id="sub-breed" name="sub-breed" aria-label="Choose sub-breed"></select>
                <button id="get-images-button" type="button">Get Images</button>
            </div>
            <div id="status" class="status-text" aria-live="polite"></div>
        </section>

        <section id="container2" class="gallery-grid"></section>
    </main>

    <script type="text/javascript" src="script.js"></script>
</body>

</html>
